name: Maiyi Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Match release tag and version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag does not match package version' }
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run notices
      - run: npm run dist:win
      - name: Check published package inputs
        shell: pwsh
        run: |
          if (!(Test-Path release/latest.yml)) { throw 'Missing updater manifest' }
          if (!(Test-Path artifacts/bundled-video-runtime/runtime.json)) { throw 'Missing portable video runtime' }
          Get-ChildItem release/SignalDesk-Setup-*.exe | ForEach-Object { $_.Name }
      - uses: actions/upload-artifact@v4
        with:
          name: Maiyi-Windows-x64
          path: |
            release/SignalDesk-Setup-*.exe
            release/SignalDesk-Setup-*.exe.blockmap
            release/latest.yml
            release/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Maiyi-Windows-x64
          path: artifacts
      - name: Publish versioned installation and update files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "wuhang521/maiyiSingalDesk"
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "迈医协同 ${GITHUB_REF_NAME}" --notes-file "$notes_file" --draft
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
